<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Test Login</title></head>
<body>
<h2>Login Test</h2>
<div id="log" style="white-space:pre-wrap;font-family:monospace;font-size:13px;background:#111;color:#0f0;padding:16px;border-radius:8px;max-height:80vh;overflow:auto;"></div>
<script type="module">
const el=document.getElementById('log');
function log(msg){el.textContent+=new Date().toISOString().slice(11,19)+' '+msg+'\n';console.log(msg);}

log('=== Step 1: Test Supabase REST API directly ===');
const SB_URL="https://cygtsszoelniltxhrtqv.supabase.co";
const SB_KEY="sb_publishable_ngHlzlzwsIeOugytI8ebSQ_fjgNAmKT";
const HDR={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json","Prefer":"return=representation"};

try{
  const r1=await fetch(SB_URL+"/rest/v1/dashboard_accounts?email=eq.eng%40admin.com&select=*",{headers:HDR});
  log('Fetch status: '+r1.status+' '+r1.statusText);
  const data=await r1.json();
  log('Data: '+JSON.stringify(data,null,2));
  if(data.length>0){
    log('Password in DB: "'+data[0].password+'"');
    log('ID in DB: "'+data[0].id+'"');
    log('Role: "'+data[0].role+'"');
    log('Status: "'+data[0].status+'"');
  }
}catch(e){log('ERROR step 1: '+e.message);}

log('\n=== Step 2: Test ID-based lookup (eng@admin_com) ===');
try{
  const r2=await fetch(SB_URL+"/rest/v1/dashboard_accounts?id=eq.eng%40admin_com&select=id,email,role",{headers:HDR});
  log('Fetch status: '+r2.status);
  const data2=await r2.json();
  log('Data: '+JSON.stringify(data2));
}catch(e){log('ERROR step 2: '+e.message);}

log('\n=== Step 3: Test CIoXNACB.js import ===');
try{
  const auth=await import('./_nuxt/CIoXNACB.js');
  log('Auth module loaded. Exports: '+Object.keys(auth).length);
  log('Has signInWithEmailAndPassword: '+(typeof auth.signInWithEmailAndPassword));
  log('Has getAuth: '+(typeof auth.getAuth));
}catch(e){log('ERROR step 3: '+e.message+'\n'+e.stack);}

log('\n=== Step 4: Test Dbi3CRcb.js import ===');
try{
  const rtdb=await import('./_nuxt/Dbi3CRcb.js');
  log('RTDB module loaded. Exports: '+Object.keys(rtdb).length);
  log('Has getDatabase: '+(typeof rtdb.getDatabase));
  log('Has ref: '+(typeof rtdb.ref));
  log('Has get: '+(typeof rtdb.get));
}catch(e){log('ERROR step 4: '+e.message+'\n'+e.stack);}

log('\n=== Step 5: Test BjpyYSOf.js import ===');
try{
  const app=await import('./_nuxt/BjpyYSOf.js');
  log('App module loaded. Exports: '+Object.keys(app).length);
  log('Has initializeApp: '+(typeof app.initializeApp));
  log('Has getApp: '+(typeof app.getApp));
  log('Has getApps: '+(typeof app.getApps));
  log('getApps(): '+JSON.stringify(app.getApps()));
}catch(e){log('ERROR step 5: '+e.message+'\n'+e.stack);}

log('\n=== Step 6: Full login flow ===');
try{
  const auth=await import('./_nuxt/CIoXNACB.js');
  const app=await import('./_nuxt/BjpyYSOf.js');

  log('Initializing app...');
  const firebaseApp=app.getApps().length?app.getApp():app.initializeApp({apiKey:"x",projectId:"x"});
  log('App initialized: '+!!firebaseApp);

  log('Getting auth...');
  const authInst=auth.getAuth(firebaseApp);
  log('Auth instance: '+!!authInst);

  log('Calling signInWithEmailAndPassword...');
  const result=await auth.signInWithEmailAndPassword(authInst,'eng@admin.com','Admin1234@@');
  log('SUCCESS! User: '+JSON.stringify({uid:result.user.uid,email:result.user.email}));

  log('\nTesting getIdTokenResult...');
  const tokenResult=await result.user.getIdTokenResult(true);
  log('Token claims: '+JSON.stringify(tokenResult.claims));
}catch(e){log('ERROR step 6: '+e.message+'\n'+(e.stack||''));}

log('\n=== Step 7: Test RTDB get for dashboardAccounts ===');
try{
  const rtdb=await import('./_nuxt/Dbi3CRcb.js');
  const app=await import('./_nuxt/BjpyYSOf.js');
  const firebaseApp=app.getApps().length?app.getApp():app.initializeApp({apiKey:"x",projectId:"x"});
  const db=rtdb.getDatabase(firebaseApp);
  log('Database: '+JSON.stringify(db));

  const r=rtdb.ref(db,'dashboardAccounts/eng@admin_com');
  log('Ref path: '+r.toString());

  const snap=await rtdb.get(r);
  log('Snapshot exists: '+snap.exists());
  log('Snapshot val: '+JSON.stringify(snap.val()));
}catch(e){log('ERROR step 7: '+e.message+'\n'+(e.stack||''));}

log('\n=== DONE ===');
</script>
</body></html>
